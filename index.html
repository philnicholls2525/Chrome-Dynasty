<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06090d" />
    <meta name="description" content="APEX Journey — build your football card collection through Drafts, packs and chapter goals." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>APEX Journey</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-view="journey" aria-label="Go to Journey">
          <span class="brand-mark">A</span>
          <span><strong>APEX</strong><small>JOURNEY</small></span>
        </button>
        <div class="wallet" aria-label="Player resources">
          <span class="wallet-item"><i class="coin-dot"></i><b id="coin-count">0</b></span>
          <span class="wallet-item"><i class="pack-dot"></i><b id="pack-count">0</b></span>
          <button class="icon-btn" id="settings-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.97 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.01V3h4v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.96 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button data-view="journey" class="active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V5l14 7-14 7Z"/></svg><span>Journey</span>
        </button>
        <button data-view="draft">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 6v12h10V6M9 10h6M9 14h4"/></svg><span>Draft</span>
        </button>
        <button data-view="packs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 8-4 8 4-8 4-8-4Z"/><path d="m4 8 8 4v8l-8-4V8Zm16 0-8 4v8l8-4V8Z"/></svg><span>Packs</span>
        </button>
        <button data-view="binder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M8 4v16M11 8h5"/></svg><span>Binder</span>
        </button>
        <button data-view="goals">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m15 9 5-5"/></svg><span>Goals</span>
        </button>
      </nav>
    </div>

    <dialog id="settings-dialog" class="sheet-dialog">
      <div class="dialog-head"><div><span class="eyebrow">SAVE DATA</span><h2>Settings</h2></div><button class="icon-btn" id="close-settings" aria-label="Close">×</button></div>
      <p>Your collection and Journey progress are saved on this device.</p>
      <button class="btn btn-danger btn-full" id="reset-progress">Start a brand-new save</button>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
