function seed(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h;}
function poseClass(name){let n=seed(name)%5+1;return 'pose'+n}
function shirtNo(id){return String((parseInt(id.slice(-3),10)%30)+1)}

const tabs=[['home','🏠','HOME'],['packs','📦','PACKS'],['collection','📖','COLLECTION'],['sbc','🔀','SBC'],['transfers','↔️','TRANSFERS'],['store','🛒','STORE'],['club','👥','CLUB'],['achievements','🏆','ACHIEVEMENTS']];
function save(){localStorage.setItem('cd2526v4',JSON.stringify(state));renderAll()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function key(c){return c.type+'|'+c.player.id+'|'+(c.parallel||'Base')+'|'+(c.insert||'')}function ownedKey(type,id,parallel='Base',insert=''){return type+'|'+id+'|'+parallel+'|'+insert}function rand(a){return a[Math.floor(Math.random()*a.length)]}function chance(x){return Math.random()<x}function clubHue(club){let h=0;for(let i=0;i<club.length;i++)h=(h*31+club.charCodeAt(i))%360;return h}function clubHue2(club){return (clubHue(club)+80)%360}function initials(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}function skinHue(name){let v=0;for(let c of name)v+=c.charCodeAt(0);return 24+(v%18)}function hairHue(name){let v=0;for(let c of name)v+=c.charCodeAt(0)*3;return 20+(v%28)}function levelReq(l){return 900+l*350}function addXP(x){state.xp+=x;while(state.xp>=levelReq(state.level)){state.xp-=levelReq(state.level);state.level++;state.coins+=500;state.gems+=5;toast('Level up!')}}function baseOwned(){return players.filter(p=>state.owned[ownedKey('Base',p.id)]).length}function totalDupes(){return Object.values(state.dupes).reduce((a,b)=>a+b,0)}
function makeCard(pack){let player=rand(players),type='Base',insert='',parallel=null,cls='rarityBase';let ic={retail:.08,hobby:.16,jumbo:.24}[pack];if(chance(ic)){type='Insert';insert=rand(inserts);cls=insert==='Future Stars'?'future':insert==='Kings of Europe'?'kings':insert==='Deco Nights'?'deco':insert==='Blacklight'?'neon':'ssp'}let mult={retail:1,hobby:2.4,jumbo:4.2}[pack];for(const p of [...parOdds].reverse()){if(chance(p.odds*mult)){parallel=p.n;cls=p.cls;break}}return {player,type,insert,parallel,cls}}
function buyPack(type){const cost={retail:250,hobby:750,jumbo:1800}[type];if(state.coins<cost)return toast('Not enough coins');state.coins-=cost;state.packs[type]++;save();toast('Pack added')}
let revealQueue=[],revealIndex=0;
function openPack(type){if(state.packs[type]<1)return toast('No '+type+' packs');state.packs[type]--;let count={retail:5,hobby:8,jumbo:15}[type];let cards=Array.from({length:count},()=>makeCard(type));if(type==='jumbo'&&!cards.some(c=>c.type==='Insert')){cards[0]=makeCard('jumbo');cards[0].type='Insert';cards[0].insert=rand(inserts);cards[0].cls='future'}cards.forEach(c=>{const k=key(c);if(state.owned[k]){state.dupes[k]=(state.dupes[k]||0)+1;c.isDupe=true}else{state.owned[k]=1;c.isNew=true}});state.opened++;addXP(65);revealQueue=cards;revealIndex=0;save();show('packs');document.getElementById('ripMount').innerHTML=`<div class="packArt" onclick="nextReveal()"><div class="packLogo">CHROME<br><span>DYNASTY</span><br><small>${{retail:'STANDARD',hobby:'HOBBY',jumbo:'JUMBO'}[type]}</small></div></div><p class="muted">Click the wrapper to start ripping. No spoilers.</p><button class="primary" onclick="nextReveal()">Rip wrapper</button>`;document.getElementById('ripCount').textContent='READY';document.getElementById('ripHistory').innerHTML=''}
function nextReveal(){if(!revealQueue.length)return;if(revealIndex>=revealQueue.length){document.getElementById('ripCount').textContent='PACK COMPLETE';document.getElementById('ripMount').innerHTML=`<button class="primary" onclick="show('store')">Open another pack</button>`;return}const c=revealQueue[revealIndex];document.getElementById('ripMount').innerHTML=cardHTML(c,'ripBig',true)+`<div style="margin-top:12px"><button class="primary" onclick="nextReveal()">${revealIndex+1>=revealQueue.length?'Finish pack':'Reveal next card'}</button></div>`;document.getElementById('ripCount').textContent=`CARD ${revealIndex+1} OF ${revealQueue.length}`;let hist=revealQueue.slice(0,revealIndex).reverse();document.getElementById('ripHistory').innerHTML=hist.map(x=>cardHTML(x,'mini')).join('');revealIndex++}
function cardHTML(c,extra='',click=false){const p=c.player;const label=c.parallel||c.insert||'BASE';const tag=c.parallel||c.insert?`<div class="parallelTag">${label}</div>`:'';const flag=c.isNew?'<div class="flag new">NEW</div>':c.isDupe?'<div class="flag dupe">DUPE</div>':'';const type=c.type==='Insert'?c.insert:(c.parallel?'NUMBERED':'BASE');const chase=chaseNames.has(p.name);const pose=poseClass(p.name+p.club);return `<div class="card ${extra} ${chase?'chase':''}" ${click?'onclick="nextReveal()"':''}><div class="cardFace ${c.cls}" style="--hue:${clubHue(p.club)};--hue2:${clubHue2(p.club)};--skin:${skinHue(p.name)};--hair:${hairHue(p.name)}"><div class="brandMark">CD</div>${tag}<div class="logoCrest">${initials(p.club)}</div><div class="playerArt"><div class="person ${pose}"><div class="hair"></div><div class="head"></div><div class="armL"></div><div class="armR"></div><div class="body" data-num="${shirtNo(p.id)}"></div><div class="legL"></div><div class="legR"></div><div class="ball"></div></div></div><div class="namePlate"><div class="pname">${p.name}</div><div class="club">${p.club}</div></div><div class="crest">${initials(p.club)}</div><div class="typeStamp">${type}</div><div class="cdStamp">${p.id}</div>${flag}</div></div>`}
function allPossible(){let arr=[];players.forEach(p=>{arr.push({player:p,type:'Base',insert:'',parallel:null,cls:'rarityBase'});inserts.forEach(ins=>arr.push({player:p,type:'Insert',insert:ins,parallel:null,cls:ins==='Future Stars'?'future':ins==='Kings of Europe'?'kings':ins==='Deco Nights'?'deco':ins==='Blacklight'?'neon':'ssp'}));parOdds.forEach(pa=>arr.push({player:p,type:'Parallel',insert:'',parallel:pa.n,cls:pa.cls}))});return arr}
const objectives=[['Open 2 Packs',()=>state.opened,2,750],['Collect 50 Base Cards',()=>baseOwned(),50,2500],['Get 3 New Inserts',()=>Object.keys(state.owned).filter(k=>k.startsWith('Insert|')).length,3,2000],['Complete 5 SBCs',()=>0,5,3000],['Pull Any Numbered Card',()=>Object.keys(state.owned).filter(k=>k.includes('/')).length,1,3000],['Build 25 Dupes',()=>totalDupes(),25,1000]];
function claimObj(i){let o=objectives[i];if(o[1]()>=o[2]&&!state.claimed[i]){state.claimed[i]=1;state.coins+=o[3];addXP(120);save();toast('Reward claimed')}}
function renderTop(){document.getElementById('topnav').innerHTML=tabs.map(t=>`<button class="navbtn ${document.getElementById(t[0]).classList.contains('active')?'active':''}" onclick="show('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}</button>`).join('');document.getElementById('wallet').innerHTML=`<div class="chip">🪙 ${state.coins.toLocaleString()}</div><div class="chip">💎 ${state.gems.toLocaleString()}</div><div class="level"><div><small>LVL</small>${state.level}</div></div>`}
function renderLeft(){document.getElementById('sideNav').innerHTML=`<button class="active" onclick="show('collection')">📁 MY CARDS</button><button onclick="show('collection')">📋 CHECKLIST</button><button onclick="show('achievements')">⭐ ACHIEVEMENTS</button><button onclick="show('club')">🛡️ CLUB</button>`;let b=baseOwned();let pct=Math.round(b/200*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('baseCount').textContent=b+' / 200';document.getElementById('ring').style.setProperty('--p',pct+'%');let nums={Base:b,'Gold /50':Object.keys(state.owned).filter(k=>k.includes('Gold /50')).length,'Orange /25':Object.keys(state.owned).filter(k=>k.includes('Orange /25')).length,'Black /10':Object.keys(state.owned).filter(k=>k.includes('Black /10')).length,'Red /5':Object.keys(state.owned).filter(k=>k.includes('Red /5')).length,'Super 1/1':Object.keys(state.owned).filter(k=>k.includes('Superfractor')).length};document.getElementById('legend').innerHTML=Object.entries(nums).map(([k,v])=>`<div class="leg"><span><i class="sq"></i>${k}</span><b>${v}</b></div>`).join('')}
function objHTML(o,i){let val=o[1](),max=o[2],done=val>=max,claimed=state.claimed[i];return `<div class="objRow"><div class="row"><b>${o[0]}</b><span class="money">${o[3]} 🪙</span></div><div class="bar"><i style="width:${Math.min(100,val/max*100)}%"></i></div><div class="row muted"><span>${Math.min(val,max)}/${max}</span><button ${!done||claimed?'disabled':''} onclick="claimObj(${i})">${claimed?'Claimed':done?'Claim':'Soon'}</button></div></div>`}
function renderRight(){let daily=objectives.slice(0,3).map((o,i)=>objHTML(o,i)).join('');let weekly=objectives.slice(3,6).map((o,i)=>objHTML(o,i+3)).join('');document.getElementById('rightPanel').innerHTML=`<div class="obj"><h3>DAILY OBJECTIVES</h3>${daily}<button class="claim" onclick="show('achievements')">VIEW ALL OBJECTIVES ›</button></div><div class="obj"><h3>WEEKLY OBJECTIVES</h3>${weekly}</div><div class="panel"><h3>REWARDS</h3><p class="muted">Level ${state.level+1} reward</p><div class="bar"><i style="width:${Math.min(100,state.xp/levelReq(state.level)*100)}%"></i></div><p class="money">Next: 500 coins + 5 gems</p></div>`}
function renderHome(){let sample=[players[20],players[10],players[48],players[85],players[72]].map(p=>({player:p,type:'Base',insert:'',parallel:null,cls:'rarityBase'}));document.getElementById('home').innerHTML=`<div class="hero"><div class="heroLeft"><h2>OPEN PACK</h2><div class="packArt"><div class="packLogo">CHROME<br><span>DYNASTY</span><br><small>5 CARDS</small></div></div><div class="packInfo"><b>Chrome Standard Pack</b><br>5 Cards<br><button class="primary" onclick="show('packs')">GO TO PACKS</button></div></div><div class="heroStage"><div class="fan">${sample.map(c=>cardHTML(c,'mini')).join('')}</div><div class="ripFooter">CARD 1 OF 5</div></div></div><div style="margin-top:18px" class="panel"><h2>Phase 1 Premium UI Build</h2><p class="muted">Dark MADFUT-style layout, currencies, level/XP, collection sidebar, right objectives panel, card-by-card pack ripping and AI-style player art are included.</p></div>`}
function renderPacks(){document.getElementById('packs').innerHTML=`<div class="hero"><div class="heroLeft"><h2>OPEN PACK</h2><div class="packArt"><div class="packLogo">CHROME<br><span>DYNASTY</span></div></div><div class="packInfo"><b>Inventory</b><br>Retail ${state.packs.retail} • Hobby ${state.packs.hobby} • Jumbo ${state.packs.jumbo}</div></div><div class="heroStage"><div><div id="ripMount" class="ripArea"><h2>Choose a pack below</h2><p class="muted">The game no longer tells you how many new cards are inside before you rip.</p></div><div id="ripCount" class="ripFooter"></div></div></div></div><div class="actions"><button onclick="openPack('retail')">Open Retail</button><button onclick="openPack('hobby')">Open Hobby</button><button onclick="openPack('jumbo')">Open Jumbo</button></div><h3>Revealed Cards</h3><div id="ripHistory" class="grid"></div>`}
function renderStore(){document.getElementById('store').innerHTML=`<div class="packChoice"><div class="panel"><h2>Retail Pack</h2><p class="muted">5 cards. Base completion pack.</p><h1 class="money">250 🪙</h1><button class="primary" onclick="buyPack('retail')">Buy Pack</button></div><div class="panel"><h2>Hobby Pack</h2><p class="muted">8 cards. Better insert and numbered odds.</p><h1 class="money">750 🪙</h1><button class="primary" onclick="buyPack('hobby')">Buy Pack</button></div><div class="panel"><h2>Dynasty Jumbo</h2><p class="muted">15 cards. Guaranteed insert.</p><h1 class="money">1800 🪙</h1><button class="primary" onclick="buyPack('jumbo')">Buy Pack</button></div></div>`}
function renderCollection(){let oldQ=document.getElementById('q')?.value||'',q=oldQ.toLowerCase(),f=document.getElementById('f')?.value||'all';let arr=allPossible().filter(c=>(c.player.name+' '+c.player.club).toLowerCase().includes(q));arr=arr.filter(c=>{let o=!!state.owned[key(c)];if(f==='owned')return o;if(f==='missing')return !o;if(f==='base')return c.type==='Base';if(f==='insert')return c.type==='Insert';if(f==='numbered')return c.type==='Parallel';return true}).slice(0,320);document.getElementById('collection').innerHTML=`<div class="panel row"><div><h2>Collection</h2><p class="muted">Search, filter and complete the set.</p></div><div class="searchbar"><input id="q" value="${oldQ}" oninput="renderCollection()" placeholder="Search players..."><select id="f" onchange="renderCollection()"><option value="all">All</option><option value="owned">Owned</option><option value="missing">Missing</option><option value="base">Base</option><option value="insert">Inserts</option><option value="numbered">Numbered</option></select></div></div><div class="collectionGrid">${arr.map(c=>`<div class="${state.owned[key(c)]?'ownedGlow':'missing'}">${cardHTML(c,'mini')}</div>`).join('')}</div>`;document.getElementById('f').value=f}
function spendDupes(n){for(const k of Object.keys(state.dupes))while(state.dupes[k]>0&&n>0){state.dupes[k]--;n--}}function quickSell(){let coins=0;for(const k of Object.keys(state.dupes))if(k.startsWith('Base|')){coins+=state.dupes[k]*20;state.dupes[k]=0}state.coins+=coins;save();toast('Sold for '+coins+' coins')}function exchange(){if(totalDupes()<25)return toast('Need 25 dupes');spendDupes(25);state.packs.hobby++;save();toast('Hobby pack earned')}function renderSBC(){document.getElementById('sbc').innerHTML=`<div class="panel"><h2>SBC / Duplicate Exchange</h2><p class="muted">Phase 1 exchange tools. More SBCs coming in Phase 3.</p><div class="actions"><button class="good" onclick="quickSell()">Quick Sell Base Dupes</button><button class="warn" onclick="exchange()">25 Dupes → Hobby Pack</button></div><h3>Total Dupes: ${totalDupes()}</h3></div>`}function renderTransfers(){let market=players.slice(0,16).map(p=>({player:p,type:'Base',insert:'',parallel:null,cls:'rarityBase'}));document.getElementById('transfers').innerHTML=`<div class="panel"><h2>Transfers</h2><p class="muted">Preview market layout for buying missing cards. Trading logic comes next phase.</p></div><div class="grid" style="margin-top:14px">${market.map(c=>cardHTML(c,'mini')).join('')}</div>`}function renderClub(){document.getElementById('club').innerHTML=`<div class="panel"><h2>Club</h2><div class="grid"><div><h1>${baseOwned()}/200</h1><p class="muted">Base cards</p></div><div><h1>${Object.keys(state.owned).length}</h1><p class="muted">Unique cards</p></div><div><h1>${totalDupes()}</h1><p class="muted">Duplicates</p></div><div><h1>${state.opened}</h1><p class="muted">Packs opened</p></div></div></div>`}function renderAchievements(){document.getElementById('achievements').innerHTML=`<div class="grid">${objectives.map((o,i)=>objHTML(o,i)).join('')}</div>`}function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');renderAll()}function renderAll(){renderTop();renderLeft();renderRight();renderHome();if(!document.getElementById('packs').innerHTML)renderPacks();renderStore();renderCollection();renderSBC();renderTransfers();renderClub();renderAchievements();renderTop()}renderAll();
</script></body></html>
